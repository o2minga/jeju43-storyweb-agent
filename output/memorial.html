<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>추모의 마음 — 제주 4·3 스토리 지도</title>
<style>
/* truth.html / map.html / voices.html / gallery.html과 같은 토큰 — 상세 페이지 전체 톤앤매너 통일. */
:root {
  --ink: #3A322D;
  --body-text: #4A443F;
  --card-bg: #F4EFEA;
  --page-bg: #FBF7F2;
  --line: #E3D8C9;
  --accent: #E05353;
  --accent-deep: #b83f3f;
  --muted: #B9A6A6;
  --bg-photo: url('assets/KakaoTalk_20260813_142854308_03.png');
  --fz-base: 16px;
}

html { font-size: calc(var(--fz-base) * var(--fz, 1)); scroll-behavior: smooth; }

html, body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Pretendard Variable', system-ui, Roboto, sans-serif;
  background: var(--page-bg);
  color: var(--body-text);
  line-height: 1.65;
}

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
h1, h2, h3 { font-family: 'Pretendard Variable', sans-serif; color: var(--ink); word-break: keep-all; }

/* 상단 고정 헤더 */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 20px; background: rgba(58, 50, 45, 0.55); backdrop-filter: blur(8px);
  color: #fff; box-sizing: border-box;
}
.top-bar-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex-wrap: wrap; }
.back-link { color: #fff; text-decoration: none; font-size: 0.88rem; font-weight: 600; white-space: nowrap; }
.back-link:hover { text-decoration: underline; }
.breadcrumb { font-size: 0.8rem; color: rgba(255, 255, 255, 0.75); white-space: nowrap; }
.breadcrumb a { color: rgba(255, 255, 255, 0.75); text-decoration: none; }
.breadcrumb a:hover { color: #fff; }
.top-bar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.top-bar-right button {
  border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.08); color: #fff;
  border-radius: 20px; padding: 5px 10px; font-size: 0.78rem; cursor: pointer; font-weight: 600;
}
.top-bar-right button:hover { background: rgba(255, 255, 255, 0.25); }
#langToggle { border-radius: 14px; }

/* 히어로 */
.hero {
  min-height: 46vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 130px 20px 56px; box-sizing: border-box;
  background-image: linear-gradient(180deg, rgba(28, 22, 18, 0.5) 0%, rgba(28, 22, 18, 0.75) 100%), var(--bg-photo);
  background-size: cover; background-position: center; background-repeat: no-repeat;
}
.badge { display: inline-block; border: 1px solid #fff; color: #fff; padding: 5px 14px; border-radius: 20px; font-size: 0.82rem; margin-bottom: 18px; }
.hero h1 { color: #fff; font-size: 2.3rem; margin: 0 0 14px; text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45); }
.hero .lead { color: rgba(255, 255, 255, 0.9); max-width: 620px; margin: 0 auto; font-size: 1.02rem; }

section.content { padding: 46px 0; }
.section-kicker { color: var(--accent); font-weight: 700; letter-spacing: 0.08em; font-size: 0.82rem; text-transform: uppercase; margin-bottom: 6px; }
.section-title { font-size: 1.4rem; margin: 0 0 10px; }

/* 헌화 존 */
.tribute-zone { background: var(--card-bg); border-radius: 12px; padding: 32px 26px; text-align: center; }
.tribute-count { font-family: 'Pretendard Variable', sans-serif; font-size: 1.5rem; color: var(--accent-deep); margin-bottom: 4px; }
.tribute-count .num { font-weight: 700; }
.tribute-note { font-size: 0.76rem; color: var(--body-text); opacity: 0.7; margin-bottom: 22px; }
.altar { position: relative; height: 64px; margin-bottom: 18px; display: flex; align-items: flex-end; justify-content: center; }
.altar-base { width: 140px; height: 10px; border-radius: 6px; background: var(--line); }
.falling-flower { position: absolute; bottom: 8px; font-size: 1.4rem; opacity: 0; pointer-events: none; }
.falling-flower.drop { animation: flowerDrop 0.9s ease forwards; }
@keyframes flowerDrop {
  0% { opacity: 0; transform: translateY(-46px) scale(0.6) rotate(-15deg); }
  60% { opacity: 1; transform: translateY(0) scale(1.05) rotate(6deg); }
  100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
}
.tribute-btn {
  border: none; background: var(--accent); color: #fff; font-size: 1.02rem; font-weight: 700;
  padding: 14px 30px; border-radius: 30px; cursor: pointer; box-shadow: 0 10px 24px rgba(224, 83, 83, 0.32);
  transition: transform 0.15s, box-shadow 0.15s;
}
.tribute-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(224, 83, 83, 0.42); }
.tribute-btn:active { transform: translateY(0) scale(0.98); }

/* 작성 폼 카드 */
.form-card { background: var(--card-bg); border-radius: 12px; padding: 26px 28px; margin-top: 40px; }
.form-row { margin-bottom: 16px; }
.form-row label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.form-row input[type="text"], .form-row textarea {
  width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  font-family: inherit; font-size: 0.92rem; color: var(--ink); background: #fff;
}
.form-row input[type="text"]:focus, .form-row textarea:focus { outline: none; border-color: var(--accent); }
.form-row textarea { resize: vertical; min-height: 80px; }
.char-count { text-align: right; font-size: 0.76rem; color: var(--body-text); opacity: 0.75; margin-top: 4px; }
.char-count.limit { color: var(--accent-deep); font-weight: 700; }
.submit-btn {
  border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 0.92rem;
  padding: 11px 24px; border-radius: 24px; cursor: pointer;
}
.submit-btn:hover { background: var(--accent-deep); }
.submit-btn:disabled { background: var(--muted); cursor: not-allowed; }
.form-error { color: var(--accent-deep); font-size: 0.8rem; margin-top: 8px; display: none; }
.form-error.show { display: block; }
.local-note { font-size: 0.76rem; color: var(--body-text); opacity: 0.7; margin-top: 10px; }

/* 방명록 그리드 */
.guestbook-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 34px; }
.memorial-card { background: var(--card-bg); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; }
.memorial-card .flower-icon { font-size: 1.3rem; margin-bottom: 8px; }
.memorial-card .msg { font-size: 0.92rem; color: var(--ink); margin: 0 0 14px; flex: 1; word-break: break-word; }
.memorial-card .card-footer { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: var(--body-text); opacity: 0.85; }
.memorial-card .author-line { display: flex; flex-direction: column; }
.like-btn { border: none; background: none; cursor: pointer; font-size: 0.88rem; color: var(--body-text); display: flex; align-items: center; gap: 4px; }
.like-btn.liked { color: var(--accent-deep); }

/* 하단 네비게이션 */
.bottom-nav { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; padding: 46px 0 90px; }
.bottom-nav a {
  display: inline-block; border: 1px solid var(--accent); color: var(--accent-deep); background: var(--card-bg);
  padding: 12px 24px; border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 0.92rem;
}
.bottom-nav a:hover { background: var(--accent); color: #fff; }

/* 우측 하단 플로팅 챗봇 버튼 */
.chatbot-fab {
  position: fixed; right: 20px; bottom: 20px; z-index: 1500; display: flex; align-items: center; gap: 8px;
  background: var(--ink); color: #fff; border: none; border-radius: 30px; padding: 10px 18px 10px 12px;
  cursor: pointer; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); font-size: 0.88rem; font-weight: 700;
}
.chatbot-fab:hover { background: #4a4038; }
.chatbot-panel {
  position: fixed; right: 20px; bottom: 78px; z-index: 1500; width: 260px; background: var(--card-bg);
  border-radius: 12px; padding: 16px 18px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25); display: none;
  font-size: 0.85rem; color: var(--ink);
}
.chatbot-panel.show { display: block; }
.chatbot-panel .close-panel { position: absolute; top: 8px; right: 10px; border: none; background: none; color: var(--body-text); font-size: 1rem; cursor: pointer; }

@media (max-width: 900px) {
  .guestbook-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .guestbook-grid { grid-template-columns: 1fr; }
  .hero { padding: 110px 16px 44px; }
  .hero h1 { font-size: 1.8rem; }
  .breadcrumb { display: none; }
}
</style>
</head>

    var parts = text.split("{{count}}");
    el.appendChild(document.createTextNode(parts[0]));
    var numSpan = document.createElement("span");
    numSpan.className = "num";
    numSpan.textContent = readCount().toLocaleString();
    el.appendChild(numSpan);
    el.appendChild(document.createTextNode(parts[1] || ""));
  }

  document.getElementById("tributeBtn").addEventListener("click", function () {
    var next = readCount() + 1;
    writeCount(next);
    renderTributeCount();
    var flower = document.getElementById("fallingFlower");
    flower.classList.remove("drop");
    // 리플로우를 강제해 같은 애니메이션을 다시 재생시킨다.
    void flower.offsetWidth;
    flower.classList.add("drop");
  });

  var likes = readLikes();

  // remoteMessages는 memorial_messages 테이블(anon: select·insert만 가능)에서 가져온 실제
  // 방문자 글이다. 아직 하나도 없거나 불러오기에 실패하면 SEED_MESSAGES만 보여준다 —
  // 없는 방문자 글을 있는 것처럼 지어내지 않는다.
  var remoteMessages = [];
  var remoteStatus = "loading"; // loading | ready | error

  function getAllMessages() {
    return remoteMessages.concat(SEED_MESSAGES);
  }

  function fetchRemoteMessages() {
    if (!sb) { remoteStatus = "error"; renderGuestbook(); return; }
    sb.from("memorial_messages")
      .select("id, author, message, created_at")
      .order("created_at", { ascending: false })
      .limit(60)
      .then(function (res) {
        if (res.error) { remoteStatus = "error"; renderGuestbook(); return; }
        remoteMessages = (res.data || []).map(function (row) {
          return { id: row.id, author: row.author, message: row.message, date: formatDate(new Date(row.created_at)), likes: 0 };
        });
        remoteStatus = "ready";
        renderGuestbook();
      })
      .catch(function () { remoteStatus = "error"; renderGuestbook(); });
  }

  function renderGuestbookStatus() {
    var el = document.getElementById("guestbookStatus");
    if (remoteStatus === "loading") { el.textContent = t("guestbookLoading"); el.style.display = "block"; }
    else if (remoteStatus === "error") { el.textContent = t("guestbookLoadError"); el.style.display = "block"; }
    else { el.style.display = "none"; }
  }

  function renderGuestbook() {
    renderGuestbookStatus();
    var el = document.getElementById("guestbookGrid");
    el.innerHTML = "";
    getAllMessages().forEach(function (m) {
      var card = document.createElement("div");
      card.className = "memorial-card";

      var icon = document.createElement("div");
      icon.className = "flower-icon";
      icon.textContent = "🌸";
      card.appendChild(icon);

      var msg = document.createElement("p");
      msg.className = "msg";
      msg.textContent = m.isSeed ? pick(m.message) : m.message;
      card.appendChild(msg);

      var footer = document.createElement("div");
      footer.className = "card-footer";

      var authorLine = document.createElement("div");
      authorLine.className = "author-line";
      var authorEl = document.createElement("strong");
      authorEl.textContent = m.isSeed ? pick(m.author) : m.author;
      var dateEl = document.createElement("span");
      dateEl.textContent = m.date;
      authorLine.appendChild(authorEl);
      authorLine.appendChild(dateEl);
      footer.appendChild(authorLine);

      var likeBtn = document.createElement("button");
      likeBtn.type = "button";
      likeBtn.className = "like-btn" + (likes[m.id] ? " liked" : "");
      var likeCount = m.likes + (likes[m.id] ? 1 : 0);
      likeBtn.innerHTML = (likes[m.id] ? "❤" : "🤍") + " <span>" + likeCount + "</span>";
      likeBtn.setAttribute("aria-label", t("likeLabel"));
      likeBtn.addEventListener("click", function () {
        likes[m.id] = !likes[m.id];
        writeLikes(likes);
        renderGuestbook();
      });
      footer.appendChild(likeBtn);

      card.appendChild(footer);
      el.appendChild(card);
    });
  }

  var authorInput = document.getElementById("authorInput");
  var messageInput = document.getElementById("messageInput");
  var charCountEl = document.getElementById("charCount");

  function updateCharCount() {
    var len = messageInput.value.length;
    charCountEl.textContent = len + " / 100";
    charCountEl.classList.toggle("limit", len >= 100);
  }
  messageInput.addEventListener("input", updateCharCount);

  var submitBtn = document.getElementById("submitBtn");
  document.getElementById("memorialForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = authorInput.value.trim();
    var message = messageInput.value.trim();
    var errorEl = document.getElementById("formError");
    var networkErrorEl = document.getElementById("formNetworkError");
    networkErrorEl.classList.remove("show");
    if (!name || !message) {
      errorEl.classList.add("show");
      return;
    }
    errorEl.classList.remove("show");

    if (!sb) { networkErrorEl.classList.add("show"); return; }

    submitBtn.disabled = true;
    var originalLabel = submitBtn.textContent;
    submitBtn.textContent = t("submitBtnPending");

    sb.from("memorial_messages")
      .insert([{ author: name, message: message }])
      .select("id, author, message, created_at")
      .then(function (res) {
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
        if (res.error || !res.data || !res.data[0]) {
          networkErrorEl.classList.add("show");
          return;
        }
        var row = res.data[0];
        remoteMessages.unshift({ id: row.id, author: row.author, message: row.message, date: formatDate(new Date(row.created_at)), likes: 0 });
        remoteStatus = "ready";
        authorInput.value = "";
        messageInput.value = "";
        updateCharCount();
        renderGuestbook();
      })
      .catch(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
        networkErrorEl.classList.add("show");
      });
  });

  function applyStaticText() {
    document.title = t("docTitle");
    document.documentElement.lang = lang;
    document.getElementById("backLink").textContent = t("backLink");
    document.getElementById("breadcrumbCurrent").textContent = t("breadcrumbCurrent");
    document.querySelector("#breadcrumb a").textContent = t("breadcrumbHome");
    document.getElementById("fzMinus").title = t("fzMinus");
    document.getElementById("fzMinus").setAttribute("aria-label", t("fzMinus"));
    document.getElementById("fzPlus").title = t("fzPlus");
    document.getElementById("fzPlus").setAttribute("aria-label", t("fzPlus"));
    var langBtn = document.getElementById("langToggle");
    langBtn.title = t("langToggleTitle");
    langBtn.setAttribute("aria-label", t("langToggleTitle"));
    langBtn.textContent = lang === "ko" ? "EN" : "KO";
    document.getElementById("heroBadge").textContent = t("heroBadge");
    document.getElementById("heroTitle").textContent = t("heroTitle");
    document.getElementById("heroLead").textContent = t("heroLead");
    document.getElementById("tributeNote").textContent = t("tributeNote");
    document.getElementById("tributeBtnLabel").textContent = t("tributeBtnLabel");
    document.getElementById("formTitle").textContent = t("formTitle");
    document.getElementById("authorLabel").textContent = t("authorLabel");
    document.getElementById("messageLabel").textContent = t("messageLabel");
    document.getElementById("submitBtn").textContent = t("submitBtn");
    document.getElementById("formError").textContent = t("formError");
    document.getElementById("formNetworkError").textContent = t("formNetworkError");
    document.getElementById("navPeace").textContent = t("navPeace");
    document.getElementById("navMap").textContent = t("navMap");
    document.getElementById("chatbotFabLabel").textContent = t("chatbotFabLabel");
    document.getElementById("chatbotPanelText").textContent = t("chatbotPanelText");
  }

  function renderAll() {
    applyStaticText();
    renderTributeCount();
    renderGuestbook();
  }

  document.getElementById("langToggle").addEventListener("click", function () {
    lang = lang === "ko" ? "en" : "ko";
    try { localStorage.setItem("jeju43-lang", lang); } catch (e) { /* 무시 */ }
    renderAll();
  });

  var FZ_MIN = 0.9, FZ_MAX = 1.3, FZ_STEP = 0.1;
  var fz = 1;
  function applyFz() { document.documentElement.style.setProperty("--fz", fz.toFixed(2)); }
  document.getElementById("fzMinus").addEventListener("click", function () {
    fz = Math.max(FZ_MIN, +(fz - FZ_STEP).toFixed(2)); applyFz();
  });
  document.getElementById("fzPlus").addEventListener("click", function () {
    fz = Math.min(FZ_MAX, +(fz + FZ_STEP).toFixed(2)); applyFz();
  });

  var chatbotFab = document.getElementById("chatbotFab");
  var chatbotPanel = document.getElementById("chatbotPanel");
  chatbotFab.addEventListener("click", function () {
    var showing = chatbotPanel.classList.toggle("show");
    chatbotFab.setAttribute("aria-expanded", String(showing));
  });
  document.getElementById("chatbotClose").addEventListener("click", function () {
    chatbotPanel.classList.remove("show");
    chatbotFab.setAttribute("aria-expanded", "false");
  });

  renderAll();
  fetchRemoteMessages();
})();
</script>
</body>
</html>
