<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미디어 갤러리 — 제주 4·3 스토리 지도</title>
<style>
/* truth.html / map.html / voices.html과 같은 토큰 — 상세 페이지 전체가 같은 톤앤매너를 쓰도록. */
:root {
  --ink: #3A322D;
  --body-text: #4A443F;
  --card-bg: #F4EFEA;
  --page-bg: #FBF7F2;
  --line: #E3D8C9;
  --accent: #E05353;
  --accent-deep: #b83f3f;
  --muted: #B9A6A6;
  --bg-photo: url('assets/KakaoTalk_20260813_142854308_03.png');
  --fz-base: 16px;
}

html { font-size: calc(var(--fz-base) * var(--fz, 1)); scroll-behavior: smooth; }

html, body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Pretendard Variable', system-ui, Roboto, sans-serif;
  background: var(--page-bg);
  color: var(--body-text);
  line-height: 1.65;
}

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
h1, h2, h3 { font-family: 'Pretendard Variable', sans-serif; color: var(--ink); word-break: keep-all; }

/* 상단 고정 헤더 */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 20px; background: rgba(58, 50, 45, 0.55); backdrop-filter: blur(8px);
  color: #fff; box-sizing: border-box;
}
.top-bar-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex-wrap: wrap; }
.back-link { color: #fff; text-decoration: none; font-size: 0.88rem; font-weight: 600; white-space: nowrap; }
.back-link:hover { text-decoration: underline; }
.breadcrumb { font-size: 0.8rem; color: rgba(255, 255, 255, 0.75); white-space: nowrap; }
.breadcrumb a { color: rgba(255, 255, 255, 0.75); text-decoration: none; }
.breadcrumb a:hover { color: #fff; }
.top-bar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.top-bar-right button {
  border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.08); color: #fff;
  border-radius: 20px; padding: 5px 10px; font-size: 0.78rem; cursor: pointer; font-weight: 600;
}
.top-bar-right button:hover { background: rgba(255, 255, 255, 0.25); }
#langToggle { border-radius: 14px; }

/* 히어로 */
.hero {
  min-height: 46vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 130px 20px 56px; box-sizing: border-box;
  background-image: linear-gradient(180deg, rgba(28, 22, 18, 0.5) 0%, rgba(28, 22, 18, 0.75) 100%), var(--bg-photo);
  background-size: cover; background-position: center; background-repeat: no-repeat;
}
.badge { display: inline-block; border: 1px solid #fff; color: #fff; padding: 5px 14px; border-radius: 20px; font-size: 0.82rem; margin-bottom: 18px; }
.hero h1 { color: #fff; font-size: 2.3rem; margin: 0 0 14px; text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45); }
.hero .lead { color: rgba(255, 255, 255, 0.9); max-width: 620px; margin: 0 auto; font-size: 1.02rem; }

section.content { padding: 50px 0; }
.section-lead { color: var(--body-text); max-width: 680px; margin: 0 0 24px; }

.sample-banner {
  background: rgba(224, 83, 83, 0.12);
  border: 1px solid rgba(224, 83, 83, 0.35);
  color: var(--accent-deep);
  border-radius: 12px;
  padding: 12px 18px;
  font-size: 0.85rem;
  margin: 0 0 26px;
}

/* 필터 탭 */
.filter-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.filter-tab {
  border: 1px solid var(--line); background: var(--card-bg); color: var(--ink);
  padding: 7px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; font-family: inherit;
}
.filter-tab:hover { border-color: var(--accent); }
.filter-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

/* 미디어 그리드 */
.media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.media-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; cursor: pointer; }
.media-thumb { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: #e6dccb; }
.media-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease; }
.media-card:hover .media-thumb img { transform: scale(1.06); }
.media-overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(28, 22, 18, 0); opacity: 0; transition: opacity 0.25s, background 0.25s; color: #fff; font-size: 1.6rem;
}
.media-card:hover .media-overlay { opacity: 1; background: rgba(28, 22, 18, 0.28); }
.media-badge {
  position: absolute; top: 8px; left: 8px; font-size: 0.66rem; font-weight: 700; color: #fff;
  background: rgba(28, 22, 18, 0.65); border-radius: 8px; padding: 2px 8px;
}
.media-duration {
  position: absolute; bottom: 8px; right: 8px; font-size: 0.7rem; font-weight: 700; color: #fff;
  background: rgba(28, 22, 18, 0.75); border-radius: 6px; padding: 2px 7px;
}
.media-info { padding: 12px 14px 16px; }
.media-info h3 { font-size: 0.95rem; margin: 0 0 4px; }
.media-meta { font-size: 0.76rem; color: var(--body-text); opacity: 0.85; margin-bottom: 8px; }
.media-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.media-tags .tag { font-size: 0.7rem; color: var(--accent-deep); background: rgba(224, 83, 83, 0.1); border-radius: 10px; padding: 1px 8px; }

/* 준비 중 placeholder 타일 */
.media-card.pending { cursor: default; }
.media-card.pending .media-thumb {
  display: flex; align-items: center; justify-content: center; background: var(--card-bg);
  border: 1px dashed var(--line); color: var(--muted); font-size: 0.85rem; text-align: center; padding: 20px;
}
.media-card.pending:hover .media-thumb img { transform: none; }

.empty-note { padding: 40px 20px; color: var(--body-text); text-align: center; font-size: 0.9rem; grid-column: 1 / -1; }

/* 라이트박스 모달 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(28, 22, 18, 0.72); z-index: 2000; display: none;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--card-bg); border-radius: 12px; max-width: 680px; width: 100%; max-height: 88vh;
  overflow-y: auto; position: relative;
}
.modal-box .modal-close {
  position: absolute; top: 12px; right: 14px; border: none; background: rgba(28, 22, 18, 0.55); color: #fff;
  width: 30px; height: 30px; border-radius: 50%; font-size: 1rem; cursor: pointer; z-index: 2;
}
.modal-box img { width: 100%; max-height: 55vh; object-fit: cover; display: block; }
.modal-body { padding: 20px 24px 26px; }
.modal-body h3 { margin: 0 0 6px; font-size: 1.1rem; }
.modal-meta { font-size: 0.82rem; color: var(--body-text); opacity: 0.85; margin-bottom: 12px; }
.modal-desc { font-size: 0.92rem; margin: 0 0 14px; }
.modal-source {
  font-size: 0.78rem; color: var(--body-text); opacity: 0.8; border-top: 1px solid var(--line); padding-top: 12px;
}

/* 하단 네비게이션 */
.bottom-nav { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; padding: 10px 0 90px; }
.bottom-nav a {
  display: inline-block; border: 1px solid var(--accent); color: var(--accent-deep); background: var(--card-bg);
  padding: 12px 24px; border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 0.92rem;
}
.bottom-nav a:hover { background: var(--accent); color: #fff; }

/* 우측 하단 플로팅 챗봇 버튼 */
.chatbot-fab {
  position: fixed; right: 20px; bottom: 20px; z-index: 1500; display: flex; align-items: center; gap: 8px;
  background: var(--ink); color: #fff; border: none; border-radius: 30px; padding: 10px 18px 10px 12px;
  cursor: pointer; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); font-size: 0.88rem; font-weight: 700;
}
.chatbot-fab:hover { background: #4a4038; }
.chatbot-panel {
  position: fixed; right: 20px; bottom: 78px; z-index: 1500; width: 260px; background: var(--card-bg);
  border-radius: 12px; padding: 16px 18px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25); display: none;
  font-size: 0.85rem; color: var(--ink);
}
.chatbot-panel.show { display: block; }
.chatbot-panel .close-panel { position: absolute; top: 8px; right: 10px; border: none; background: none; color: var(--body-text); font-size: 1rem; cursor: pointer; }

@media (max-width: 900px) {
  .media-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .media-grid { grid-template-columns: 1fr; }
  .hero { padding: 110px 16px 44px; }
  .hero h1 { font-size: 1.8rem; }
  .breadcrumb { display: none; }
}
</style>
</head>
<body>

<header class="top-bar">
  <div class="top-bar-left">
    <a class="back-link" href="index.html" id="backLink">← 메인으로 돌아가기</a>
    <nav class="breadcrumb" aria-label="현재 위치" id="breadcrumb"><a href="index.html">홈</a> &gt; <span id="breadcrumbCurrent">미디어 갤러리</span></nav>
  </div>
  <div class="top-bar-right">
    <button id="fzMinus" type="button" title="글자 작게" aria-label="글자 작게">A-</button>
    <button id="fzPlus" type="button" title="글자 크게" aria-label="글자 크게">A+</button>
    <button id="langToggle" type="button" title="언어 전환" aria-label="언어 전환">EN</button>
  </div>
</header>

<section class="hero">
  <span class="badge" id="heroBadge">제주 4·3 78주년</span>
  <h1 id="heroTitle">미디어 갤러리</h1>
  <p class="lead" id="heroLead">사진과 영상으로 기록된 제주 4·3의 시각 사료와 추모의 순간들을 만납니다.</p>
</section>

<section class="content">
  <div class="wrap">
    <div class="filter-tabs" id="filterTabs"></div>
    <div class="media-grid" id="mediaGrid"></div>
  </div>
</section>

<div class="bottom-nav">
  <a href="memorial.html" id="navMemorial">추모의 마음 작성하러 가기</a>
  <a href="map.html" id="navMap">지도로 유적지 탐방하기</a>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" type="button" aria-label="닫기">✕</button>
    <img id="modalImg" src="" alt="">
    <div class="modal-body">
      <h3 id="modalTitle"></h3>
      <div class="modal-meta" id="modalMeta"></div>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-source" id="modalSource"></div>
    </div>
  </div>
</div>

<button class="chatbot-fab" id="chatbotFab" type="button" aria-haspopup="true" aria-expanded="false">
  <svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true">
    <g>
      <ellipse cx="50" cy="20" rx="16" ry="22" fill="#e0607a"/>
      <ellipse cx="50" cy="20" rx="16" ry="22" fill="#e0607a" transform="rotate(60 50 50)"/>
      <ellipse cx="50" cy="20" rx="16" ry="22" fill="#e0607a" transform="rotate(120 50 50)"/>
      <ellipse cx="50" cy="20" rx="16" ry="22" fill="#e0607a" transform="rotate(180 50 50)"/>
      <ellipse cx="50" cy="20" rx="16" ry="22" fill="#e0607a" transform="rotate(240 50 50)"/>
      <ellipse cx="50" cy="20" rx="16" ry="22" fill="#e0607a" transform="rotate(300 50 50)"/>
      <circle cx="50" cy="50" r="16" fill="#f6c94d"/>
    </g>
  </svg>
  <span id="chatbotFabLabel">4·3 AI 챗봇</span>
</button>
<div class="chatbot-panel" id="chatbotPanel" role="dialog" aria-label="4·3 AI 챗봇">
  <button class="close-panel" id="chatbotClose" type="button" aria-label="닫기">✕</button>
  <p id="chatbotPanelText" style="margin:0;">이 페이지의 AI 챗봇은 아직 준비 중입니다. 장소별 상세 페이지에서 먼저 만나보실 수 있어요.</p>
</div>

<script>
(function () {
  "use strict";

  // "site" 4건은 03-visual 스킬이 실제로 만든 [연출] 이미지(gwandeokjeong/goneuldong/neobeunsungi 폴더)를 그대로 쓴다.
  // "historical"(1947년 당시 사료)·"documentary"(다큐멘터리 영상)·"memorial-event"(추념식 영상)는 아직 검증된
  // 실제 사진·영상이 하나도 없어, 없는 사료를 지어내는 대신 카테고리를 빈 상태로 두고 "준비 중" 안내만 보여준다.
  var MEDIA = [
    {
      id: "gwandeokjeong-1", category: "site", type: "photo",
      title: { ko: "관덕정 광장, 오늘의 모습", en: "Gwandeokjeong Square Today" },
      year: "2026",
      location: { ko: "제주시 삼도2동", en: "Samdo 2-dong, Jeju-si" },
      tags: { ko: ["#유적지현장", "#제주시"], en: ["#OnSite", "#JejuCity"] },
      img: "gwandeokjeong/assets/img-01.png",
      desc: { ko: "지금도 사람들이 오가는 관덕정 광장을 그린 AI 연출 이미지입니다. 1947년 당시를 촬영한 실제 사진이 아닙니다.", en: "An AI-dramatized image of Gwandeokjeong Square as it looks today. This is not an actual photograph from 1947." }
    },
    {
      id: "goneuldong-1", category: "site", type: "photo",
      title: { ko: "곤을동 잃어버린 마을 터", en: "The Site of Goneul-dong, The Lost Village" },
      year: "2026",
      location: { ko: "제주시 화북동", en: "Hwabuk-dong, Jeju-si" },
      tags: { ko: ["#유적지현장", "#잃어버린마을"], en: ["#OnSite", "#LostVillage"] },
      img: "goneuldong/assets/img-01.png",
      desc: { ko: "마을이 사라진 자리에 남은 돌담을 그린 AI 연출 이미지입니다.", en: "An AI-dramatized image of the stone walls remaining where the village once stood." }
    },
    {
      id: "neobeunsungi-2", category: "site", type: "photo",
      title: { ko: "북촌리 옛 학교 자리", en: "The Former School Site in Bukchon-ri" },
      year: "2026",
      location: { ko: "제주시 조천읍 북촌리", en: "Bukchon-ri, Jocheon-eup, Jeju-si" },
      tags: { ko: ["#유적지현장", "#북촌리"], en: ["#OnSite", "#Bukchonri"] },
      img: "neobeunsungi/assets/img-02.png",
      desc: { ko: "주민들이 모였던 학교 자리를 그린 AI 연출 이미지입니다.", en: "An AI-dramatized image of the former school site where residents were once gathered." }
    },
    {
      id: "neobeunsungi-3", category: "site", type: "photo",
      title: { ko: "너븐숭이 인근 옴팡밭", en: "The Ompangbat Field near Neobeunsungi" },
      year: "2026",
      location: { ko: "제주시 조천읍 북촌리", en: "Bukchon-ri, Jocheon-eup, Jeju-si" },
      tags: { ko: ["#유적지현장", "#북촌리"], en: ["#OnSite", "#Bukchonri"] },
      img: "neobeunsungi/assets/img-03.png",
      desc: { ko: "추모 공간이 조성된 밭을 그린 AI 연출 이미지입니다.", en: "An AI-dramatized image of the field where a memorial space was created." }
    }
  ];

  var I18N = {
    ko: {
      docTitle: "미디어 갤러리 — 제주 4·3 스토리 지도",
      backLink: "← 메인으로 돌아가기", breadcrumbHome: "홈", breadcrumbCurrent: "미디어 갤러리",
      fzMinus: "글자 작게", fzPlus: "글자 크게", langToggleTitle: "언어 전환",
      heroBadge: "제주 4·3 78주년",
      heroTitle: "미디어 갤러리",
      heroLead: "사진과 영상으로 기록된 제주 4·3의 시각 사료와 추모의 순간들을 만납니다.",
      filterAll: "전체 보기",
      filters: { historical: "역사 사료 사진", site: "유적지 현장 사진", documentary: "다큐멘터리·영상", "memorial-event": "추모·문화 행사" },
      emptyNote: "이 카테고리에는 아직 검증된 자료가 없습니다. 실제 사료가 확보되면 채워질 예정입니다.",
      fxBadge: "연출",
      sourceLabel: "출처: AI 연출 이미지(03-visual 스킬 생성) — 실제 기록 사진이 아닙니다.",
      navMemorial: "추모의 마음 작성하러 가기", navMap: "지도로 유적지 탐방하기",
      chatbotFabLabel: "4·3 AI 챗봇",
      chatbotPanelText: "이 페이지의 AI 챗봇은 아직 준비 중입니다. 장소별 상세 페이지에서 먼저 만나보실 수 있어요."
    },
    en: {
      docTitle: "Media Gallery — Jeju 4·3 Story Map",
      backLink: "← Back to Main", breadcrumbHome: "Home", breadcrumbCurrent: "Media Gallery",
      fzMinus: "Smaller text", fzPlus: "Larger text", langToggleTitle: "Switch language",
      heroBadge: "Jeju 4·3, 78th Anniversary",
      heroTitle: "Media Gallery",
      heroLead: "Meet the visual record of Jeju 4·3 and its moments of remembrance, through photos and video.",
      filterAll: "All",
      filters: { historical: "Historical Photos", site: "On-site Photos", documentary: "Documentary Video", "memorial-event": "Memorial Events" },
      emptyNote: "No verified material exists for this category yet. It will be filled in once real sources are secured.",
      fxBadge: "Staged",
      sourceLabel: "Source: AI-dramatized image (produced by skill 03-visual) — not an actual historical photograph.",
      navMemorial: "Write a Memorial Message", navMap: "Explore the Sites on the Map",
      chatbotFabLabel: "Jeju 4·3 AI Chatbot",
      chatbotPanelText: "The AI chatbot for this page is still being prepared. You can already try it on individual place pages."
    }
  };

  var lang = "ko";
  try { if (localStorage.getItem("jeju43-lang") === "en") lang = "en"; } catch (e) { /* 무시 */ }
  function t(key) { return I18N[lang][key]; }
  function pick(field) { return field[lang] || field.ko; }

  var categoryFilter = "all";

  function getFilteredMedia() {
    if (categoryFilter === "all") return MEDIA;
    return MEDIA.filter(function (m) { return m.category === categoryFilter; });
  }

  function renderFilterTabs() {
    var el = document.getElementById("filterTabs");
    el.innerHTML = "";
    function makeTab(key, label) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "filter-tab" + (categoryFilter === key ? " active" : "");
      btn.textContent = label;
      btn.addEventListener("click", function () { categoryFilter = key; renderAll(); });
      return btn;
    }
    el.appendChild(makeTab("all", t("filterAll")));
    Object.keys(t("filters")).forEach(function (key) {
      el.appendChild(makeTab(key, t("filters")[key]));
    });
  }

  function renderMediaGrid() {
    var el = document.getElementById("mediaGrid");
    el.innerHTML = "";
    var list = getFilteredMedia();
    if (!list.length) {
      el.insertAdjacentHTML("beforeend", '<p class="empty-note">' + t("emptyNote") + "</p>");
      return;
    }
    list.forEach(function (m) {
      var card = document.createElement("div");
      card.className = "media-card";
      var tagsHtml = pick(m.tags).map(function (tag) { return '<span class="tag">' + tag + "</span>"; }).join("");
      card.innerHTML =
        '<div class="media-thumb">' +
        '<span class="media-badge">' + t("fxBadge") + "</span>" +
        '<img src="' + m.img + '" alt="">' +
        '<div class="media-overlay">🔍</div>' +
        "</div>" +
        '<div class="media-info">' +
        "<h3>" + pick(m.title) + "</h3>" +
        '<div class="media-meta">' + m.year + " · " + pick(m.location) + "</div>" +
        '<div class="media-tags">' + tagsHtml + "</div>" +
        "</div>";
      card.addEventListener("click", function () { openModal(m); });
      el.appendChild(card);
    });
  }

  var modalOverlay = document.getElementById("modalOverlay");
  function openModal(m) {
    document.getElementById("modalImg").src = m.img;
    document.getElementById("modalTitle").textContent = pick(m.title);
    document.getElementById("modalMeta").textContent = m.year + " · " + pick(m.location);
    document.getElementById("modalDesc").textContent = pick(m.desc);
    document.getElementById("modalSource").textContent = t("sourceLabel");
    modalOverlay.classList.add("show");
  }
  function closeModal() { modalOverlay.classList.remove("show"); }
  document.getElementById("modalClose").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", function (e) { if (e.target === modalOverlay) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  function applyStaticText() {
    document.title = t("docTitle");
    document.documentElement.lang = lang;
    document.getElementById("backLink").textContent = t("backLink");
    document.getElementById("breadcrumbCurrent").textContent = t("breadcrumbCurrent");
    document.querySelector("#breadcrumb a").textContent = t("breadcrumbHome");
    document.getElementById("fzMinus").title = t("fzMinus");
    document.getElementById("fzMinus").setAttribute("aria-label", t("fzMinus"));
    document.getElementById("fzPlus").title = t("fzPlus");
    document.getElementById("fzPlus").setAttribute("aria-label", t("fzPlus"));
    var langBtn = document.getElementById("langToggle");
    langBtn.title = t("langToggleTitle");
    langBtn.setAttribute("aria-label", t("langToggleTitle"));
    langBtn.textContent = lang === "ko" ? "EN" : "KO";
    document.getElementById("heroBadge").textContent = t("heroBadge");
    document.getElementById("heroTitle").textContent = t("heroTitle");
    document.getElementById("heroLead").textContent = t("heroLead");
    document.getElementById("navMemorial").textContent = t("navMemorial");
    document.getElementById("navMap").textContent = t("navMap");
    document.getElementById("chatbotFabLabel").textContent = t("chatbotFabLabel");
    document.getElementById("chatbotPanelText").textContent = t("chatbotPanelText");
  }

  function renderAll() {
    applyStaticText();
    renderFilterTabs();
    renderMediaGrid();
  }

  document.getElementById("langToggle").addEventListener("click", function () {
    lang = lang === "ko" ? "en" : "ko";
    try { localStorage.setItem("jeju43-lang", lang); } catch (e) { /* 무시 */ }
    renderAll();
  });

  var FZ_MIN = 0.9, FZ_MAX = 1.3, FZ_STEP = 0.1;
  var fz = 1;
  function applyFz() { document.documentElement.style.setProperty("--fz", fz.toFixed(2)); }
  document.getElementById("fzMinus").addEventListener("click", function () {
    fz = Math.max(FZ_MIN, +(fz - FZ_STEP).toFixed(2)); applyFz();
  });
  document.getElementById("fzPlus").addEventListener("click", function () {
    fz = Math.min(FZ_MAX, +(fz + FZ_STEP).toFixed(2)); applyFz();
  });

  var chatbotFab = document.getElementById("chatbotFab");
  var chatbotPanel = document.getElementById("chatbotPanel");
  chatbotFab.addEventListener("click", function () {
    var showing = chatbotPanel.classList.toggle("show");
    chatbotFab.setAttribute("aria-expanded", String(showing));
  });
  document.getElementById("chatbotClose").addEventListener("click", function () {
    chatbotPanel.classList.remove("show");
    chatbotFab.setAttribute("aria-expanded", "false");
  });

  renderAll();
})();
</script>
</body>
</html>
